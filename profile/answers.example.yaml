# Fixed screening answers, copied to $APPLYPILOT_HOME/answers.yaml by `applypilot init`.
# The autofill stage (Phase 4) uses ONLY these for these questions. Edit here, never per form.
work_authorization:
  authorized_to_work_in_us: "Yes"          # on F-1 OPT, then STEM OPT
  visa_status: "F-1 student (OPT/STEM OPT eligible)"
  require_sponsorship_now: "No"            # OPT + STEM OPT cover ~3 years
  require_sponsorship_future: "Yes"        # H-1B later; truthful answer, may trigger auto-reject on some forms
  us_citizen_or_permanent_resident: "No"
availability:
  earliest_start: "January 2027"
  graduation: "December 2026"
  willing_to_relocate: "Yes"
  remote_hybrid_onsite: "Any"
compensation:
  expected_salary: "Open / market rate for the role"
eeo:                                       # voluntary self-identification
  gender: "Decline to self-identify"
  race_ethnicity: "Decline to self-identify"
  veteran_status: "I don't wish to answer"
  disability: "I do not wish to answer"
misc:
  how_did_you_hear: "Company careers page"
  previously_employed_here: "No"
  over_18: "Yes"
  # Set these to make the matching questions automatic; empty = the form asks you
  pronouns: ""                         # e.g. "he/him"
  currently_employed: ""               # "Yes" / "No"
  government_official_or_relative: ""  # "Yes" / "No": a current government official, or close relative of one
  noncompete: ""                       # "Yes" / "No": subject to a non-compete or similar agreement
  most_recent_employer: ""             # e.g. "West Virginia University"
  most_recent_title: ""                # e.g. "Graduate Research Assistant"
